
# ===========================================================================
# WhatFunnel — local development stack
# ===========================================================================
# Usage:
#   docker compose up -d   — start everything; migrations run automatically
#   make up                — same as above, via Makefile convenience target
#   make down              — stop all services
#   make test              — run full test suite (requires stack to be running)
# ===========================================================================
#
# Migrations are handled by the 'migrate' service which runs goose up before
# any application service starts.  No manual migration step is needed after
# cloning.  To run additional migrations manually: make migrate
# ===========================================================================

services:
  # ---------------------------------------------------------------------------
  # Database — Postgres with pgvector extension
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: whatfunnel-postgres
    environment:
      POSTGRES_USER: whatfunnel
      POSTGRES_PASSWORD: whatfunnel
      POSTGRES_DB: whatfunnel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatfunnel -d whatfunnel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis — event bus placeholder (Redis Streams wired in Build Prompt 2)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: whatfunnel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Migrations — runs goose up before any app service starts
  # Uses the official goose Docker image; exits 0 on success so that
  # dependent services can use condition: service_completed_successfully.
  # ---------------------------------------------------------------------------
  migrate:
    build: ./packages/go-common/migrations
    container_name: whatfunnel-migrate
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://whatfunnel:whatfunnel@postgres:5432/whatfunnel?sslmode=disable
      GOOSE_MIGRATION_DIR: /migrations
    volumes:
      - ./packages/go-common/migrations:/migrations:ro
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Identity Service — auth, RBAC, audit log
  # ---------------------------------------------------------------------------
  identity-svc:
    build:
      context: .
      dockerfile: services/identity-svc/Dockerfile
    container_name: whatfunnel-identity-svc
    environment:
      DATABASE_URL: postgres://whatfunnel:whatfunnel@postgres:5432/whatfunnel?sslmode=disable
      SESSION_SECRET: change-me-in-production-at-least-32-chars
      ENCRYPTION_KEY: "change-me-32-byte-hex-key-padded"
      PORT: "8081"
      LOG_LEVEL: info
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Workspace Service — account, users, pipeline config
  # ---------------------------------------------------------------------------
  workspace-svc:
    build:
      context: .
      dockerfile: services/workspace-svc/Dockerfile
    container_name: whatfunnel-workspace-svc
    environment:
      DATABASE_URL: postgres://whatfunnel:whatfunnel@postgres:5432/whatfunnel?sslmode=disable
      SESSION_SECRET: change-me-in-production-at-least-32-chars
      ENCRYPTION_KEY: "change-me-32-byte-hex-key-padded"
      PORT: "8082"
      LOG_LEVEL: info
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # API Gateway — reverse proxy and auth enforcement
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: whatfunnel-api-gateway
    environment:
      IDENTITY_SVC_URL: http://identity-svc:8081
      WORKSPACE_SVC_URL: http://workspace-svc:8082
      CONVERSATION_SVC_URL: http://conversation-svc:8083
      NOTIFICATION_SVC_URL: http://notification-svc:8084
      AI_KB_COMPILER_URL: http://ai-kb-compiler:8085
      SESSION_SECRET: change-me-in-production-at-least-32-chars
      PORT: "8080"
      LOG_LEVEL: info
    ports:
      - "18080:8080"
    depends_on:
      - identity-svc
      - workspace-svc
      - notification-svc
      - ai-kb-compiler
    restart: unless-stopped


  # ---------------------------------------------------------------------------
  # Conversation Service — ingestion consumer, outbound API
  # ---------------------------------------------------------------------------
  conversation-svc:
    build:
      context: .
      dockerfile: services/conversation-svc/Dockerfile
    container_name: whatfunnel-conversation-svc
    environment:
      DATABASE_URL: postgres://whatfunnel:whatfunnel@postgres:5432/whatfunnel?sslmode=disable
      REDIS_URL: redis:6379
      SESSION_SECRET: change-me-in-production-at-least-32-chars
      ENCRYPTION_KEY: "change-me-32-byte-hex-key-padded"
      PORT: "8083"
      LOG_LEVEL: info
      MATRIX_HOMESERVER_URL: http://synapse:8008
      MATRIX_SERVER_NAME: localhost
      MATRIX_REGISTRATION_SHARED_SECRET: "B4t@Ss,gB8^0gRoFBG*A,kI6mmpPf:w5-w.~mWh5+i:MbIB@yF"
      MATRIX_WHATSAPP_BRIDGE_IDENTITY: "@whatsappbot:localhost"
      # Set these when their bridge containers and registrations are enabled.
      MATRIX_TELEGRAM_BRIDGE_IDENTITY: ""
      MATRIX_INSTAGRAM_BRIDGE_IDENTITY: ""
      MATRIX_MESSENGER_BRIDGE_IDENTITY: ""
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Notification Service — WebSocket push service
  # ---------------------------------------------------------------------------
  notification-svc:
    build:
      context: .
      dockerfile: services/notification-svc/Dockerfile
    container_name: whatfunnel-notification-svc
    environment:
      DATABASE_URL: postgres://whatfunnel:whatfunnel@postgres:5432/whatfunnel?sslmode=disable
      REDIS_URL: redis:6379
      SESSION_SECRET: change-me-in-production-at-least-32-chars
      ENCRYPTION_KEY: "change-me-32-byte-hex-key-padded"
      PORT: "8084"
      LOG_LEVEL: info
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # AI Answer Service — cascade answer agent
  # ---------------------------------------------------------------------------
  ai-answer-svc:
    build:
      context: .
      dockerfile: services/ai-answer-svc/Dockerfile
    container_name: whatfunnel-ai-answer-svc
    environment:
      DATABASE_URL: postgres://whatfunnel:whatfunnel@postgres:5432/whatfunnel?sslmode=disable
      REDIS_URL: redis:6379
      APP_ENCRYPTION_KEY: "change-me-32-byte-hex-key-padded"
      SESSION_SECRET: change-me-in-production-at-least-32-chars
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Synapse (Matrix Homeserver) & mautrix-whatsapp bridge
  # ---------------------------------------------------------------------------
  matrix-init:
    image: alpine:latest
    container_name: whatfunnel-matrix-init
    volumes:
      - synapse_data:/synapse
      - mautrix_whatsapp_data:/whatsapp
      - ./adapters/matrix-mautrix/config:/config:ro
      - ./adapters/matrix-mautrix/bridges:/bridges:ro
    command: >
      sh -c "
      echo 'Initializing Matrix and WhatsApp bridge configurations...';
      mkdir -p /synapse /whatsapp;
      {
        while IFS= read -r line; do
          if [ \"$$line\" = '# APP_SERVICE_CONFIG_FILES' ]; then
            echo 'app_service_config_files:';
            echo '  - /data/whatsapp-registration.yaml';
            for bridge in telegram messenger instagram; do
              if [ -f \"/bridges/$$bridge/registration.yaml\" ]; then
                cp \"/bridges/$$bridge/registration.yaml\" \"/synapse/$$bridge-registration.yaml\";
                echo \"  - /data/$$bridge-registration.yaml\";
              fi;
            done;
          else
            echo \"$$line\";
          fi;
        done < /config/homeserver.yaml;
      } > /synapse/homeserver.yaml;
      cp /config/whatsapp-registration.yaml /synapse/whatsapp-registration.yaml;
      cp /config/localhost.log.config /synapse/localhost.log.config;
      chown -R 991:991 /synapse;
      cp /config/config.yaml /whatsapp/config.yaml;
      cp /config/whatsapp-registration.yaml /whatsapp/registration.yaml;
      chown -R 1337:1337 /whatsapp;
      echo 'Configurations initialized successfully.';
      "

  synapse:
    image: matrixdotorg/synapse:latest
    container_name: whatfunnel-synapse
    ports:
      - "8008:8008"
    volumes:
      - synapse_data:/data
    depends_on:
      matrix-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mautrix-whatsapp:
    image: dock.mau.dev/mautrix/whatsapp:latest
    container_name: whatfunnel-mautrix-whatsapp
    volumes:
      - mautrix_whatsapp_data:/data
    depends_on:
      synapse:
        condition: service_started
      matrix-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Stubs — built in later prompts
  # ---------------------------------------------------------------------------
  # AI Knowledge Base Compiler — paste compiler, conversation mining, scheduler
  # ---------------------------------------------------------------------------
  ai-kb-compiler:
    build:
      context: .
      dockerfile: services/ai-kb-compiler/Dockerfile
    container_name: whatfunnel-ai-kb-compiler
    environment:
      DATABASE_URL: postgres://whatfunnel:whatfunnel@postgres:5432/whatfunnel?sslmode=disable
      REDIS_URL: redis:6379
      APP_ENCRYPTION_KEY: "change-me-32-byte-hex-key-padded"
      PORT: "8085"
      LOG_LEVEL: info
      MINING_INTERVAL_HOURS: "6"
    ports:
      - "8085:8085"
    volumes:
      - ./services/ai-kb-compiler:/app
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  synapse_data:
  mautrix_whatsapp_data:
