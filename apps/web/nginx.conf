server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Internal Docker DNS resolver with dynamic 5s cache
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 3s;

    # Ingress readiness probe for Docker / external healthchecks
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"web"}\n';
    }

    # Static assets caching
    location /_app/immutable/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy with dynamic runtime DNS re-resolution and failover
    location /api-gateway/ {
        set $upstream_api_gateway http://api-gateway:8080;
        rewrite ^/api-gateway/(.*) /$1 break;
        proxy_pass $upstream_api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 5s;
    }

    # WebSocket proxy (routed directly to notification-svc to avoid gateway double-proxy)
    # A variable upstream forces runtime DNS re-resolution (via the resolver above).
    # With a variable and no URI part, nginx forwards the original request URI
    # unchanged, so /ws (and its query string) still reaches notification-svc's /ws.
    location /ws {
        set $upstream_ws http://notification-svc:8084;
        proxy_pass $upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA routing fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
