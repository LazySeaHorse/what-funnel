<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
		<title>What Funnel - Omni Channel Lead Management & Automation</title>
		<style>
			#wf-boot {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #f9fafc;
				color: #334155;
				font-family: Poppins, system-ui, sans-serif;
			}
			.wf-app-ready #wf-boot { display: none; }
			#wf-boot > div { display: flex; flex-direction: column; align-items: center; text-align: center; }
			#wf-boot svg { width: 44px; height: 44px; }
			#wf-boot-track { width: 128px; height: 4px; margin-top: 20px; overflow: hidden; border-radius: 999px; background: #dce8f7; }
			#wf-boot-bar { width: 50%; height: 100%; border-radius: 999px; background: #0057d0; animation: wf-boot-sweep 1.15s ease-in-out infinite; }
			#wf-boot p { margin: 16px 0 0; font-size: 14px; font-weight: 500; }
			#wf-boot small { margin-top: 4px; color: #94a3b8; font-size: 12px; }
			@keyframes wf-boot-sweep { from { transform: translateX(-110%); } to { transform: translateX(210%); } }
			@media (prefers-reduced-motion: reduce) { #wf-boot-bar { animation: none; transform: translateX(50%); } }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-[#F9FAFC] text-slate-800 antialiased font-sans">
		<div id="wf-boot" role="status" aria-live="polite">
			<div>
				<svg viewBox="0 0 36 36" fill="none" aria-hidden="true">
					<rect width="36" height="36" rx="10" fill="#0057D0" />
					<circle cx="14" cy="14" r="3" fill="white" />
					<circle cx="22" cy="18" r="4.5" fill="white" />
					<circle cx="14" cy="23" r="2.5" fill="white" />
				</svg>
				<div id="wf-boot-track" aria-hidden="true"><div id="wf-boot-bar"></div></div>
				<p>Starting What Funnel…</p>
				<small>Connecting to your workspace.</small>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
		<noscript>What Funnel requires JavaScript to run.</noscript>
	</body>
</html>
